name: Mend
kind: company
description: Mend is a HIPAA-compliant telehealth and patient engagement platform
  for mental and behavioral healthcare organizations, powering appointment
  scheduling, automated reminders, secure video visits, digital intake forms and
  consents, patient messaging, payments, and AI no-show prediction. Mend integrates
  with EHR and practice-management systems through a combination of HL7, SFTP, and
  an API served from api.mendfamily.com. That API exists and is used by Mend's own
  portal for session initialization and signaling, but its reference documentation
  is delivered through a login-gated customer knowledge base rather than a public
  developer portal, so Mend's programmatic surface is best characterized as
  partner- and customer-gated rather than openly self-serve.
