apis:
- aid: mend-health:mend-health-appointments-api
  name: Mend Appointments and Scheduling API
  tags:
  - Appointments
  - Scheduling
  - Reminders
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://bestservice.mendfamily.com/hc/en-us/sections/360007371714-API-Documentation
  baseURL: https://api.mendfamily.com
  endpointsModeled: true
  properties:
  - url: https://bestservice.mendfamily.com/hc/en-us/sections/360007371714-API-Documentation
    type: Documentation
  description: Logical grouping for creating and managing appointments, provider
    availability, patient self-scheduling, rescheduling, and automated appointment
    reminders. Mend documents these capabilities in its customer knowledge base and
    serves the API from api.mendfamily.com, but the concrete endpoint paths are
    behind a login-gated API Documentation section and are not published openly.
    Endpoints are modeled from Mend's described capabilities and were not confirmed
    against a public specification.
- aid: mend-health:mend-health-patients-api
  name: Mend Patients API
  tags:
  - Patients
  - Demographics
  - Records
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://bestservice.mendfamily.com/hc/en-us/sections/360007371714-API-Documentation
  baseURL: https://api.mendfamily.com
  endpointsModeled: true
  properties:
  - url: https://bestservice.mendfamily.com/hc/en-us/sections/360007371714-API-Documentation
    type: Documentation
  description: Logical grouping for creating and syncing patient records,
    demographics, and contact details between Mend and an external EHR or
    practice-management system. Mend performs this synchronization through a mix of
    HL7, SFTP, and its api.mendfamily.com API, but the specific patient endpoints
    are only described inside the gated customer knowledge base. Endpoints are
    modeled from Mend's described capabilities and were not confirmed against a
    public specification.
- aid: mend-health:mend-health-video-visits-api
  name: Mend Video Visits API
  tags:
  - Video Visits
  - WebRTC
  - Virtual Care
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://bestservice.mendfamily.com/hc/en-us/sections/360007371714-API-Documentation
  baseURL: https://api.mendfamily.com
  endpointsModeled: true
  properties:
  - url: https://bestservice.mendfamily.com/hc/en-us/sections/360007371714-API-Documentation
    type: Documentation
  description: Logical grouping for initializing secure video telemedicine sessions
    and the virtual waiting room. The real-time media itself runs over WebRTC via
    Vonage TokBox and OpenTok relay servers, while api.mendfamily.com handles
    session initialization and signaling. There is no public, documented video
    endpoint or WebSocket surface on Mend's own API. Endpoints are modeled from
    Mend's described capabilities and were not confirmed against a public
    specification.
- aid: mend-health:mend-health-forms-api
  name: Mend Digital Forms and Intake API
  tags:
  - Forms
  - Intake
  - Consents
  - Assessments
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://bestservice.mendfamily.com/hc/en-us/sections/360007371714-API-Documentation
  baseURL: https://api.mendfamily.com
  endpointsModeled: true
  properties:
  - url: https://bestservice.mendfamily.com/hc/en-us/sections/360007371714-API-Documentation
    type: Documentation
  description: Logical grouping for assigning digital intake forms, consents, and
    assessments to patients and returning their completed responses to the practice.
    Mend describes these digital forms as a core patient-engagement capability, but
    the programmatic endpoints live inside the gated API Documentation section.
    Endpoints are modeled from Mend's described capabilities and were not confirmed
    against a public specification.
