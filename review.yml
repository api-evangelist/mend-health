actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Mend's own API, and no public OpenAPI
    or open developer portal is available. Mend's real API is partner/customer
    gated, so this entry documents four logical APIs (appointments/scheduling,
    patients, video visits, and digital forms) with endpointsModeled set to true
    and no fabricated endpoint paths. No AsyncAPI document was created because
    there is no Mend-owned server-push transport to model.
